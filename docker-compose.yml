services:
  db:
    image: postgres:16-alpine
    container_name: oficina-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: oficina_mecanica
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - oficina-net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: oficina-app
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/oficina_mecanica?schema=public
      PORT: '3000'
    depends_on:
      db:
        condition: service_healthy
    networks:
      - oficina-net

volumes:
  pgdata:

networks:
  oficina-net:
    driver: bridge
