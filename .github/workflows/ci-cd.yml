name: Esteira CI/CD - Tech Challenge PosTech

on:
  push:
    branches: [ main, develop, "feature/*" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. CONTINUOUS INTEGRATION (CI) - Integracao Continua
  # ─────────────────────────────────────────────────────────────────────────────
  ci:
    name: "🔍 Integracao Continua (CI) - Testes & Qualidade"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oficina_mecanica_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: "📂 [CI 1/9] Obter codigo-fonte do repositorio"
        uses: actions/checkout@v4

      - name: "⚙️ [CI 2/9] Configurar ambiente Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: "📦 [CI 3/9] Instalar dependencias do projeto"
        run: |
          echo "🚀 Instalando dependencias com npm ci..."
          npm ci

      - name: "🗄️ [CI 4/9] Gerar Cliente do Prisma ORM"
        run: |
          echo "🚀 Gerando os arquivos do Prisma Client..."
          npx prisma generate

      - name: "🧹 [CI 5/9] Validar regras de qualidade de codigo (ESLint)"
        run: |
          echo "🔍 Verificando padroes de codigo e linter..."
          npm run lint

      - name: "🧪 [CI 6/9] Executar testes unitarios e de cobertura (Jest)"
        run: |
          echo "🧪 Rodando testes unitarios..."
          npm run test
          echo "📊 Gerando relatorio de cobertura..."
          npm run test:cov

      - name: "🌐 [CI 7/9] Executar testes de integracao (E2E)"
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/oficina_mecanica_test?schema=public"
          JWT_SECRET: "ci-cd-test-jwt-secret"
          JWT_EXPIRES_IN: "1d"
          PORT: 3000
        run: |
          echo "🗄️ Aplicando schema no banco de dados temporario PostgreSQL..."
          npx prisma db push
          echo "🌐 Executando testes E2E..."
          npm run test:e2e

      - name: "🏗️ [CI 8/9] Validar compilacao do TypeScript (Build)"
        run: |
          echo "🏗️ Compilando aplicacao NestJS..."
          npm run build

      - name: "🐳 [CI 9/9] Testar construcao da Imagem Docker"
        run: |
          echo "🐳 Testando docker build da imagem..."
          docker build -t oficina-api:test .
          echo "✅ Validacao da imagem Docker concluida!"

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. CONTINUOUS DEPLOYMENT (CD) - Publicacao da Imagem
  # ─────────────────────────────────────────────────────────────────────────────
  cd:
    name: "🚀 Entrega Continua (CD) - Publicacao da Imagem & K8s"
    needs: ci
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: "📂 [CD 1/5] Obter codigo-fonte do repositorio"
        uses: actions/checkout@v4

      - name: "🛠️ [CD 2/5] Configurar ferramentas do Docker (QEMU & Buildx)"
        uses: docker/setup-qemu-action@v3

      - name: "🛠️ Configurar Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "🔑 [CD 3/5] Autenticar no GitHub Container Registry (GHCR)"
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "🏷️ [CD 4/5] Gerar metadados e tags para a Imagem Docker"
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/develop' }}

      - name: "🚀 [CD 5/5] Construir e publicar Imagem Docker no GHCR"
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: "☸️ Validar sintaxe dos manifestos Kubernetes (K8s)"
        run: |
          echo "☸️ Validando sintaxe dos manifestos Kubernetes na pasta /k8s..."
          node -e "
            const fs = require('fs');
            const path = require('path');
            function getFiles(dir) {
              const subdirs = fs.readdirSync(dir);
              const files = subdirs.map((subdir) => {
                const res = path.resolve(dir, subdir);
                return fs.statSync(res).isDirectory() ? getFiles(res) : res;
              });
              return files.reduce((a, f) => a.concat(f), []);
            }
            const files = getFiles('./k8s').filter(f => f.endsWith('.yaml') || f.endsWith('.yml'));
            console.log('Encontrados ' + files.length + ' arquivos K8s YAML:');
            files.forEach(f => console.log('  OK ' + path.relative(process.cwd(), f)));
            console.log('Todos os manifestos Kubernetes foram validados com sucesso!');
          "

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. INFRA + DEPLOY AWS (Apenas Producao - main)
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: "🏗️ Infraestrutura & Deploy AWS (Producao)"
    needs: cd
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
      TF_STATE_BUCKET: techchallenge-oficina-tfstate-2026

    steps:
      - name: "📂 [Deploy 1/7] Obter codigo-fonte do repositorio"
        uses: actions/checkout@v4

      - name: "🔧 [Deploy 2/7] Instalar Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
          terraform_wrapper: false

      - name: "🪣 [Deploy 3/7] Garantir bucket S3 para estado do Terraform"
        run: |
          echo "🪣 Verificando bucket de estado: $TF_STATE_BUCKET..."
          if ! aws s3api head-bucket --bucket "$TF_STATE_BUCKET" 2>/dev/null; then
            echo "📦 Criando bucket: $TF_STATE_BUCKET..."
            aws s3api create-bucket \
              --bucket "$TF_STATE_BUCKET" \
              --region "$AWS_REGION"
            echo "✅ Bucket criado!"
          else
            echo "✅ Bucket ja existe. Reutilizando..."
          fi

      - name: "⚙️ [Deploy 4/7] Inicializar Terraform (backend S3)"
        working-directory: infra
        run: |
          echo "⚙️ Inicializando Terraform com backend S3..."
          terraform init \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=prod/terraform.tfstate" \
            -backend-config="region=$AWS_REGION"
          echo "✅ Terraform inicializado!"

      - name: "🔍 [Deploy 5a/7] Importar recursos existentes na AWS (evitar duplicatas)"
        working-directory: infra
        run: |
          echo "🔍 Verificando recursos existentes na AWS e importando para o estado do Terraform..."

          # Importar bucket S3 se ja existir
          BUCKET_NAME="techchallenge-oficina-mecanica-storage-2026"
          if aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
            echo "📦 Bucket S3 ja existe - importando..."
            terraform import aws_s3_bucket.oficina_storage "$BUCKET_NAME" 2>/dev/null || echo "   (ja no estado)"
          fi

          # Importar Security Group do RDS se ja existir
          SG_RDS_ID=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=oficina_rds_sg" \
            --query "SecurityGroups[0].GroupId" \
            --output text 2>/dev/null)
          if [ "$SG_RDS_ID" != "None" ] && [ -n "$SG_RDS_ID" ]; then
            echo "🔒 Security Group RDS ja existe ($SG_RDS_ID) - importando..."
            terraform import aws_security_group.rds_sg "$SG_RDS_ID" 2>/dev/null || echo "   (ja no estado)"
          fi

          # Importar Security Group da App se ja existir
          SG_APP_ID=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=oficina_app_sg" \
            --query "SecurityGroups[0].GroupId" \
            --output text 2>/dev/null)
          if [ "$SG_APP_ID" != "None" ] && [ -n "$SG_APP_ID" ]; then
            echo "🔒 Security Group App ja existe ($SG_APP_ID) - importando..."
            terraform import aws_security_group.app_sg "$SG_APP_ID" 2>/dev/null || echo "   (ja no estado)"
          fi

          # Importar Key Pair se ja existir
          KEY_EXISTS=$(aws ec2 describe-key-pairs \
            --key-names "oficina-mecanica-key" \
            --query "KeyPairs[0].KeyName" \
            --output text 2>/dev/null)
          if [ "$KEY_EXISTS" = "oficina-mecanica-key" ]; then
            echo "🔑 Key Pair ja existe - importando..."
            terraform import aws_key_pair.app_key_pair "oficina-mecanica-key" 2>/dev/null || echo "   (ja no estado)"
          fi

          # Importar instancia EC2 se ja existir
          EC2_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=OficinaMecanicaServer" "Name=instance-state-name,Values=running,pending,stopped" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text 2>/dev/null)
          if [ "$EC2_ID" != "None" ] && [ -n "$EC2_ID" ]; then
            echo "🖥️ EC2 ja existe ($EC2_ID) - importando..."
            terraform import aws_instance.app_server "$EC2_ID" 2>/dev/null || echo "   (ja no estado)"
          fi

          # Importar RDS se ja existir
          RDS_EXISTS=$(aws rds describe-db-instances \
            --db-instance-identifier "oficina-mecanica" \
            --query "DBInstances[0].DBInstanceIdentifier" \
            --output text 2>/dev/null)
          if [ "$RDS_EXISTS" = "oficina-mecanica" ]; then
            echo "🗄️ RDS ja existe - importando..."
            terraform import aws_db_instance.postgres_db "oficina-mecanica" 2>/dev/null || echo "   (ja no estado)"
          fi

          echo "✅ Verificacao e importacao concluidas!"

      - name: "🏗️ [Deploy 5b/7] Provisionar infraestrutura na AWS (Terraform Apply)"
        working-directory: infra
        run: |
          echo "🏗️ Aplicando configuracao da infraestrutura na AWS..."
          terraform apply -auto-approve
          echo "✅ Infraestrutura provisionada!"
          echo "📍 IP: $(terraform output -raw server_public_ip)"

      - name: "📤 [Deploy 6/7] Capturar outputs do Terraform"
        id: tf
        working-directory: infra
        run: |
          EC2_HOST=$(terraform output -raw server_public_ip)
          echo "ec2_host=$EC2_HOST" >> $GITHUB_OUTPUT

          # Salvar chave SSH e DATABASE_URL em arquivos temporarios
          terraform output -raw ssh_private_key > /tmp/ssh_key.pem
          chmod 600 /tmp/ssh_key.pem

          # Montar DATABASE_URL manualmente (output sensivel nao pode ser exibido diretamente)
          DB_ENDPOINT=$(terraform output -raw rds_endpoint)
          DATABASE_URL="postgresql://postgres:postgres123456@${DB_ENDPOINT}/oficina_mecanica?schema=public"
          echo "database_url=$DATABASE_URL" >> $GITHUB_OUTPUT

          echo "✅ Outputs capturados!"
          echo "📍 EC2 Host: $EC2_HOST"

      - name: "🚀 [Deploy 7/7] Deploy da aplicacao na EC2 via SSH"
        env:
          EC2_HOST: ${{ steps.tf.outputs.ec2_host }}
          DATABASE_URL: ${{ steps.tf.outputs.database_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          echo "⏳ Aguardando instancia EC2 ficar acessivel via SSH..."
          for i in $(seq 1 24); do
            if nc -z -w5 "$EC2_HOST" 22 2>/dev/null; then
              echo "✅ SSH acessivel!"
              break
            fi
            echo "   ⏳ Tentativa $i/24 - aguardando..."
            sleep 10
          done

          echo "⏳ Aguardando instalacao do Docker na maquina (mais 30s)..."
          sleep 30

          echo "🚀 Conectando na EC2 e fazendo deploy..."
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -i /tmp/ssh_key.pem ubuntu@"$EC2_HOST" \
            "
            set -e
            echo '🐳 Verificando Docker...'
            for i in \$(seq 1 12); do
              if command -v docker &>/dev/null; then
                echo 'Docker OK'
                break
              fi
              echo 'Aguardando Docker... '\$i'/12'
              sleep 10
            done

            echo '🔑 Autenticando no GHCR...'
            echo '$GITHUB_TOKEN' | sudo docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin

            echo '🚀 Baixando imagem mais recente...'
            sudo docker pull 'ghcr.io/$GITHUB_REPOSITORY:latest'

            echo '🔄 Removendo container anterior...'
            sudo docker stop oficina-api 2>/dev/null || true
            sudo docker rm oficina-api 2>/dev/null || true

            echo '🚀 Subindo novo container...'
            sudo docker run -d \
              --name oficina-api \
              --restart always \
              -p 3000:3000 \
              -e DATABASE_URL='$DATABASE_URL' \
              -e JWT_SECRET='fiap-tech-challenge-secret-2026' \
              -e JWT_EXPIRES_IN='1d' \
              -e PORT=3000 \
              'ghcr.io/$GITHUB_REPOSITORY:latest'

            echo '✅ Container iniciado!'
            sudo docker ps | grep oficina-api
            "

          echo ""
          echo "🎉 ======================================="
          echo "   DEPLOY CONCLUIDO COM SUCESSO!"
          echo "🎉 ======================================="
          echo ""
          echo "📍 URL da API:     http://$EC2_HOST:3000"
          echo "📖 URL do Swagger: http://$EC2_HOST:3000/api/docs"
          echo ""
