name: CI/CD Pipeline - Tech Challenge PosTech

on:
  push:
    branches: [ main, develop, "feature/*" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # 1. CONTINUOUS INTEGRATION (CI)
  # ────────────────────────────────────────────────────────────────────────────
  ci:
    name: Build & Test (CI)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oficina_mecanica_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test

      - name: Run Test Coverage
        run: npm run test:cov

      - name: Run E2E Tests
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/oficina_mecanica_test?schema=public"
          JWT_SECRET: "ci-cd-test-jwt-secret"
          JWT_EXPIRES_IN: "1d"
          PORT: 3000
        run: |
          npx prisma db push
          npm run test:e2e

      - name: Validate TypeScript Build
        run: npm run build

      - name: Validate Dockerfile Build
        run: docker build -t oficina-api:test .

  # ────────────────────────────────────────────────────────────────────────────
  # 2. CONTINUOUS DEPLOYMENT (CD) - DOCKER PUSH & MANIFEST VALIDATION
  # ────────────────────────────────────────────────────────────────────────────
  cd:
    name: Publish Container & Validate K8s (CD)
    needs: ci
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/develop' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Validate Kubernetes Manifests Syntax
        run: kubectl apply --dry-run=client -R -f k8s/
