name: Esteira CI/CD - Tech Challenge PosTech

on:
  push:
    branches: [ main, develop, "feature/*" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # 1. CONTINUOUS INTEGRATION (CI) - Integração Contínua
  # ────────────────────────────────────────────────────────────────────────────
  ci:
    name: "🔍 Integração Contínua (CI) - Testes & Qualidade"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oficina_mecanica_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: "📂 [CI 1/9] Obter código-fonte do repositório"
        uses: actions/checkout@v4

      - name: "⚙️ [CI 2/9] Configurar ambiente Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: "📦 [CI 3/9] Instalar dependências do projeto"
        run: |
          echo "🚀 Instalando dependências com npm ci..."
          npm ci

      - name: "🗄️ [CI 4/9] Gerar Cliente do Prisma ORM"
        run: |
          echo "🚀 Gerando os arquivos do Prisma Client..."
          npx prisma generate

      - name: "🧹 [CI 5/9] Validar regras de qualidade de código (ESLint)"
        run: |
          echo "🔍 Verificando padrões de código e linter..."
          npm run lint

      - name: "🧪 [CI 6/9] Executar testes unitários e de cobertura (Jest)"
        run: |
          echo "🧪 Rodando testes unitários..."
          npm run test
          echo "📊 Gerando relatório de cobertura..."
          npm run test:cov

      - name: "🌐 [CI 7/9] Executar testes de integração (E2E)"
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/oficina_mecanica_test?schema=public"
          JWT_SECRET: "ci-cd-test-jwt-secret"
          JWT_EXPIRES_IN: "1d"
          PORT: 3000
        run: |
          echo "🗄️ Aplicando schema no banco de dados temporário PostgreSQL..."
          npx prisma db push
          echo "🌐 Executando testes E2E..."
          npm run test:e2e

      - name: "🏗️ [CI 8/9] Validar compilação do TypeScript (Build)"
        run: |
          echo "🏗️ Compilando aplicação NestJS..."
          npm run build

      - name: "🐳 [CI 9/9] Testar construção da Imagem Docker"
        run: |
          echo "🐳 Testando docker build da imagem..."
          docker build -t oficina-api:test .
          echo "✅ Validação da imagem Docker concluída!"

  # ────────────────────────────────────────────────────────────────────────────
  # 2. CONTINUOUS DEPLOYMENT (CD) - Entrega Contínua
  # ────────────────────────────────────────────────────────────────────────────
  cd:
    name: "🚀 Entrega Contínua (CD) - Publicação da Imagem & K8s"
    needs: ci
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: "📂 [CD 1/5] Obter código-fonte do repositório"
        uses: actions/checkout@v4

      - name: "🛠️ [CD 2/5] Configurar ferramentas do Docker (QEMU & Buildx)"
        uses: docker/setup-qemu-action@v3

      - name: "🛠️ Configurar Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "🔑 [CD 3/5] Autenticar no GitHub Container Registry (GHCR)"
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "🏷️ [CD 4/5] Gerar metadados e tags para a Imagem Docker"
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/develop' }}

      - name: "🚀 [CD 5/5] Construir e publicar Imagem Docker no GHCR"
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: "☸️ Validar sintaxe dos manifestos Kubernetes (K8s)"
        run: |
          echo "☸️ Validando sintaxe dos manifestos Kubernetes na pasta /k8s..."
          node -e "
            const fs = require('fs');
            const path = require('path');
            function getFiles(dir) {
              const subdirs = fs.readdirSync(dir);
              const files = subdirs.map((subdir) => {
                const res = path.resolve(dir, subdir);
                return fs.statSync(res).isDirectory() ? getFiles(res) : res;
              });
              return files.reduce((a, f) => a.concat(f), []);
            }
            const files = getFiles('./k8s').filter(f => f.endsWith('.yaml') || f.endsWith('.yml'));
            console.log('Encontrados ' + files.length + ' arquivos K8s YAML:');
            files.forEach(f => console.log('  ✔ ' + path.relative(process.cwd(), f)));
            console.log('✅ Todos os manifestos Kubernetes foram validados com sucesso!');
          "

  # ────────────────────────────────────────────────────────────────────────────
  # 3. INFRAESTRUTURA + DEPLOY (Apenas Produção - main)
  # ────────────────────────────────────────────────────────────────────────────
  deploy:
    name: "🏗️ Infraestrutura & Deploy AWS (Produção)"
    needs: cd
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_STATE_BUCKET: techchallenge-oficina-tfstate-2026

    steps:
      - name: "📂 [Deploy 1/8] Obter código-fonte do repositório"
        uses: actions/checkout@v4

      # ── Terraform: Provisionamento da Infraestrutura AWS ──
      - name: "🔧 [Deploy 2/8] Instalar Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
          terraform_wrapper: false

      - name: "🪣 [Deploy 3/8] Criar bucket S3 para armazenar o estado do Terraform"
        run: |
          echo "🪣 Verificando se o bucket de estado do Terraform existe..."
          if ! aws s3api head-bucket --bucket "$TF_STATE_BUCKET" 2>/dev/null; then
            echo "📦 Bucket não encontrado. Criando bucket: $TF_STATE_BUCKET..."
            aws s3api create-bucket \
              --bucket "$TF_STATE_BUCKET" \
              --region "$AWS_REGION"
            echo "✅ Bucket criado com sucesso!"
          else
            echo "✅ Bucket já existe. Reutilizando..."
          fi

      - name: "⚙️ [Deploy 4/8] Inicializar Terraform com backend remoto (S3)"
        working-directory: infra
        run: |
          echo "⚙️ Inicializando Terraform com backend S3 para persistir o estado..."
          terraform init \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=prod/terraform.tfstate" \
            -backend-config="region=$AWS_REGION"
          echo "✅ Terraform inicializado com sucesso!"

      - name: "🏗️ [Deploy 5/8] Provisionar infraestrutura na AWS (Terraform Apply)"
        working-directory: infra
        run: |
          echo "🏗️ Provisionando recursos na AWS..."
          echo "   📋 Recursos: EC2, RDS PostgreSQL, S3, Security Groups, Chave SSH"
          terraform apply -auto-approve
          echo ""
          echo "✅ Infraestrutura provisionada com sucesso!"
          echo "📍 IP do Servidor: $(terraform output -raw server_public_ip)"

      - name: "📤 [Deploy 6/8] Capturar dados da infraestrutura criada"
        id: tf
        working-directory: infra
        run: |
          echo "📤 Capturando outputs do Terraform..."
          echo "ec2_host=$(terraform output -raw server_public_ip)" >> $GITHUB_OUTPUT
          terraform output -raw ssh_private_key > /tmp/ssh_key.pem
          chmod 600 /tmp/ssh_key.pem
          terraform output -raw database_url > /tmp/database_url.txt
          echo "✅ Dados capturados!"
          echo "📍 EC2 Host: $(terraform output -raw server_public_ip)"

      - name: "⏳ [Deploy 7/8] Aguardar inicialização da instância EC2"
        run: |
          EC2_HOST="${{ steps.tf.outputs.ec2_host }}"
          echo "⏳ Aguardando a instância EC2 ($EC2_HOST) ficar pronta..."
          echo "   ⏱️ A máquina precisa inicializar e instalar o Docker (user_data)..."
          
          # Aguardar até 3 minutos pela porta SSH (22)
          for i in $(seq 1 18); do
            if nc -z -w5 "$EC2_HOST" 22 2>/dev/null; then
              echo "✅ Porta SSH (22) aberta! Máquina está acessível."
              break
            fi
            echo "   ⏳ Tentativa $i/18 - Aguardando SSH..."
            sleep 10
          done
          
          # Aguardar mais 30s para o Docker terminar de instalar via user_data
          echo "   ⏳ Aguardando instalação do Docker na máquina (user_data)..."
          sleep 30
          echo "✅ Tempo de espera concluído!"

      # ── Deploy: Conectar na EC2 e subir a aplicação ──
      - name: "🚀 [Deploy 8/8] Realizar Deploy da aplicação na instância EC2 da AWS"
        run: |
          EC2_HOST="${{ steps.tf.outputs.ec2_host }}"
          DATABASE_URL=$(cat /tmp/database_url.txt)
          
          echo "🚀 Conectando via SSH na instância EC2: $EC2_HOST..."
          
          ssh -o StrictHostKeyChecking=no -i /tmp/ssh_key.pem ubuntu@"$EC2_HOST" << 'DEPLOY_SCRIPT'
            echo "🌐 Conectado com sucesso na instância EC2 da AWS!"
            
            echo "🐳 Verificando se o Docker está instalado..."
            for i in $(seq 1 12); do
              if command -v docker &> /dev/null; then
                echo "✅ Docker encontrado!"
                break
              fi
              echo "   ⏳ Docker ainda não instalado, aguardando... ($i/12)"
              sleep 10
            done
            
            echo "🔑 Autenticando no GitHub Container Registry (GHCR)..."
            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            echo "🚀 Baixando a versão mais recente da Imagem Docker..."
            sudo docker pull ghcr.io/${{ github.repository }}:latest
            
            echo "🔄 Parando container antigo (se existir)..."
            sudo docker stop oficina-api 2>/dev/null || true
            sudo docker rm oficina-api 2>/dev/null || true
            
            echo "🚀 Subindo a nova versão da API na porta 3000..."
            sudo docker run -d \
              --name oficina-api \
              --restart always \
              -p 3000:3000 \
              -e DATABASE_URL="DEPLOY_DB_URL" \
              -e JWT_SECRET="fiap-tech-challenge-secret" \
              -e JWT_EXPIRES_IN="1d" \
              -e PORT=3000 \
              ghcr.io/${{ github.repository }}:latest
            
            echo "✅ Container iniciado com sucesso!"
            echo "📍 API disponível em: http://$(curl -s ifconfig.me):3000"
            echo "📖 Swagger disponível em: http://$(curl -s ifconfig.me):3000/api/docs"
          DEPLOY_SCRIPT
          
          # Substituir a DATABASE_URL real (fora do heredoc para segurança)
          ssh -o StrictHostKeyChecking=no -i /tmp/ssh_key.pem ubuntu@"$EC2_HOST" \
            "sudo docker stop oficina-api && sudo docker rm oficina-api && \
             sudo docker run -d --name oficina-api --restart always -p 3000:3000 \
             -e DATABASE_URL='${DATABASE_URL}' \
             -e JWT_SECRET='fiap-tech-challenge-secret' \
             -e JWT_EXPIRES_IN='1d' \
             -e PORT=3000 \
             ghcr.io/${{ github.repository }}:latest"
          
          echo ""
          echo "🎉 ================================================="
          echo "   DEPLOY CONCLUÍDO COM SUCESSO!"
          echo "🎉 ================================================="
          echo ""
          echo "📍 URL da API:     http://$EC2_HOST:3000"
          echo "📖 URL do Swagger: http://$EC2_HOST:3000/api/docs"
          echo ""
